# Alembic: lo schema del database si cambia solo con migrazioni (cartella migrations/versions).
# Comandi utili dal container del backend:
#   alembic revision --autogenerate -m "descrizione"   crea una migrazione dai cambi ai modelli
#   alembic upgrade head                               applica le migrazioni (parte da sola all'avvio)
#   alembic current / alembic history                  dove siamo
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
