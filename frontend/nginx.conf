server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server_tokens off;

  # Pagina, manifest e service worker non vanno tenuti in cache: cambiano a ogni versione.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /service-worker.js { add_header Cache-Control "no-cache"; }
  location = /manifest.json { add_header Cache-Control "no-cache"; }

  # I file con il nome che cambia a ogni versione si possono tenere a lungo.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Applicazione a pagina singola: ogni altro indirizzo apre la pagina principale.
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
