events { worker_connections 1024; }

http {
  server {
    listen 80;

    # Video: la risposta passa a mano a mano al player, senza essere accumulata su disco dal proxy.
    location ~ ^/api/video/[0-9a-fA-F-]+/(file|sottotitoli) {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    location /api/ {
      proxy_pass http://backend:8000/api/;
      proxy_set_header Host $host;
      # Chi si connette davvero a questo nginx: sovrascritto sempre, mai preso dal client. Il backend
      # decide da PROXY_FIDUCIARI se credere agli altri header (X-Forwarded-For, CF-Connecting-IP).
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      client_max_body_size 2G;
      proxy_read_timeout 300s;
    }

    location /uploads/ {
      proxy_pass http://backend:8000/uploads/;
    }

    location / {
      proxy_pass http://frontend:3000/;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
